[package]
name = "owllet-core"
version = "0.1.0"
edition = "2021"
description = "Owllet's reusable offline wallet engine for EVM, Solana, TRON and authenticated key custody"
license-file = "PROPRIETARY.md"
readme = "README.md"
repository = "https://github.com/Philip-857-bit/fomowl-app.git"
publish = false
include = ["Cargo.toml", "Cargo.lock", "README.md", "PROPRIETARY.md", "CHANGELOG.md", "RELEASE.md", "DEPENDENCY_LICENSES.json", "src/**", "tests/**"]

[package.metadata.owllet]
distribution = "proprietary-internal"

[features]
# Preserve the existing Flutter adapter API. Other hosts can opt into less.
default = ["evm", "solana", "tron", "mnemonic-generation"]
evm = ["secp256k1", "dep:alloy", "dep:ethers-core", "dep:serde_json", "dep:sha3"]
solana = ["dep:bs58", "dep:hmac", "dep:sha2", "dep:solana-keypair", "dep:solana-signer", "dep:base64", "dep:bincode", "dep:serde", "dep:serde_json", "dep:solana-hash", "dep:solana-instruction", "dep:solana-message", "dep:solana-pubkey", "dep:solana-signature", "dep:solana-transaction"]
tron = ["secp256k1", "dep:bs58", "dep:sha2", "dep:sha3"]
# Shared primitive layer for EVM and TRON; also usable by native Rust hosts.
secp256k1 = ["dep:bip32", "dep:secp256k1"]
mnemonic-generation = ["dep:rand"]
signing-session = []
vault = ["signing-session", "dep:aes-gcm", "dep:serde", "dep:serde_json"]

[dependencies]
aes-gcm = { version = "0.10.3", features = ["zeroize"], optional = true }
alloy = { version = "2.0.5", default-features = false, features = ["consensus", "signer-local", "network", "eips"], optional = true }
bip32 = { version = "0.5.3", optional = true }
bip39 = "2.2.2"
bs58 = { version = "0.5.1", optional = true }
ethers-core = { version = "2.0.14", default-features = false, optional = true }
hex = "0.4.3"
hmac = { version = "0.12.1", optional = true }
rand = { version = "0.10.0", optional = true }
secp256k1 = { version = "0.31.1", features = ["recovery"], optional = true }
serde_json = { version = "1.0", optional = true }
sha2 = { version = "0.10.9", optional = true }
sha3 = { version = "0.10.8", optional = true }
solana-keypair = { version = "3.0.0", optional = true }
solana-signer = { version = "3.0.0", optional = true }
base64 = { version = "0.22.1", optional = true }
bincode = { version = "1.3", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
solana-hash = { version = "3.0", optional = true }
solana-instruction = { version = "3.0", optional = true }
solana-message = { version = "3.0", features = ["serde", "bincode"], optional = true }
solana-pubkey = { version = "3.0", optional = true }
solana-signature = { version = "3.0", features = ["verify"], optional = true }
solana-transaction = { version = "3.0", features = ["serde", "bincode"], optional = true }
zeroize = "1.8.2"

[dev-dependencies]
ed25519-dalek = "2.2.0"
