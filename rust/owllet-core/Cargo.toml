[package]
name = "owllet-core"
version = "0.1.0"
edition = "2021"

[dependencies]
alloy = { version = "2.0.5", default-features = false, features = ["consensus", "signer-local", "network", "eips"] }
bip32 = "0.5.3"
bip39 = "2.2.2"
bs58 = "0.5.1"
ethers-core = { version = "2.0.14", default-features = false }
hex = "0.4.3"
hmac = "0.12.1"
rand = "0.10.0"
secp256k1 = { version = "0.31.1", features = ["recovery"] }
serde_json = "1.0"
sha2 = "0.10.9"
sha3 = "0.10.8"
solana-keypair = "3.0.0"
solana-signer = "3.0.0"
zeroize = "1.8.2"

[dev-dependencies]
ed25519-dalek = "2.2.0"
