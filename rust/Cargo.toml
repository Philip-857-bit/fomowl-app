[package]
name = "rust_lib_fomowl_wallet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
argon2 = "0.5.3"
base64 = "0.22.1"
bip32 = "0.5.3"
bip39 = "2.2.2"
bs58 = "0.5.1"
ed25519-dalek = "2.2.0"
ethers-core = { version = "2.0.14", default-features = false }
ethereum-types = "0.16.0"
flutter_rust_bridge = "=2.11.1"
hex = "0.4.3"
hmac = "0.12.1"
owllet-core = { git = "https://github.com/Philip-857-bit/owllet-core.git", rev = "930eca151035eec9432d7f41b1b221bd5d27e829", version = "=0.2.0", features = ["bitcoin", "signing-session", "vault"] }
pbkdf2 = "0.12.2"
rand = "0.10.0"
secp256k1 = { version = "0.31.1", features = ["recovery"] }
serde_json = "1.0"
sha2 = "0.10.9"
sha3 = "0.10.8"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
solana-hash = "3.0"
solana-instruction = "3.0"
solana-keypair = "3.0.0"
solana-message = { version = "3.0", features = ["serde", "bincode"] }
solana-pubkey = "3.0"
solana-signer = "3.0.0"
solana-signature = { version = "3.0", features = ["verify"] }
solana-transaction = { version = "3.0", features = ["serde", "bincode"] }
zeroize = "1.8.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
