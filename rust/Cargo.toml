[package]
name = "rust_lib_fomowl_wallet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
argon2 = "0.5.3"
base64 = "0.22.1"
bip32 = "0.5.3"
bip39 = "2.2.2"
bs58 = "0.5.1"
ed25519-dalek = "2.2.0"
ethers-core = { version = "2.0.14", default-features = false }
ethereum-types = "0.16.0"
flutter_rust_bridge = "=2.11.1"
hex = "0.4.3"
hmac = "0.12.1"
pbkdf2 = "0.12.2"
rand = "0.10.0"
secp256k1 = { version = "0.31.1", features = ["recovery"] }
serde_json = "1.0"
sha2 = "0.10.9"
sha3 = "0.10.8"
zeroize = "1.8.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
