name: Dart Analysis and Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  analyze-and-test:
    runs-on: [self-hosted, linux, x64, owllet-ci]
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/rust/target/release

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure private Owllet Core access
        uses: ./.github/actions/setup-owllet-core
        with:
          ssh-private-key: ${{ secrets.OWLLET_CORE_SSH_KEY }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pin to the same SDK the release/Shorebird workflows ship with so
          # analyze/test run against the version that actually reaches users.
          flutter-version: 3.44.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build native crypto library for host tests
        run: cargo build --manifest-path rust/Cargo.toml --release --locked

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
