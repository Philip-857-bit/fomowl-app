name: Shorebird iOS Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release_ios:
    runs-on: macos-14
    defaults:
      run:
        shell: bash
    env:
      FLUTTER_VERSION: 3.38.6
      XCODE_VERSION: '16.4'
      SHOREBIRD_FLUTTER_BUILD_ARGS: --no-tree-shake-icons
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      SHOREBIRD_APP_ID: ${{ vars.SHOREBIRD_APP_ID || secrets.SHOREBIRD_APP_ID || '' }}
      SHOREBIRD_PATCH_PUBLIC_KEY_BASE64: ${{ secrets.SHOREBIRD_PATCH_PUBLIC_KEY_BASE64 }}
      BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL || 'https://core.owlletapp.com' }}
      COINGECKO_API_BASE_URL: ${{ vars.COINGECKO_API_BASE_URL || secrets.COINGECKO_API_BASE_URL || 'https://api.coingecko.com/api/v3' }}
      CONNECTIVITY_CHECK_URL: ${{ vars.CONNECTIVITY_CHECK_URL || secrets.CONNECTIVITY_CHECK_URL || 'https://www.google.com' }}
      PUSH_NOTIFICATIONS_ENABLED: ${{ vars.PUSH_NOTIFICATIONS_ENABLED || 'false' }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY || secrets.FIREBASE_API_KEY || '' }}
      FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID || secrets.FIREBASE_ANDROID_APP_ID || '' }}
      FIREBASE_IOS_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID || secrets.FIREBASE_IOS_APP_ID || '' }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID || secrets.FIREBASE_MESSAGING_SENDER_ID || '' }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID || '' }}
      FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET || secrets.FIREBASE_STORAGE_BUCKET || '' }}
      FIREBASE_IOS_BUNDLE_ID: ${{ vars.FIREBASE_IOS_BUNDLE_ID || secrets.FIREBASE_IOS_BUNDLE_ID || 'com.fomowl.fomowlWallet' }}
      GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || secrets.IOS_EXPORT_METHOD || 'app-store' }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust iOS targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Validate Shorebird release inputs
        run: |
          set -euo pipefail
          required=(
            SHOREBIRD_TOKEN
            SHOREBIRD_APP_ID
            SHOREBIRD_PATCH_PUBLIC_KEY_BASE64
            IOS_CERTIFICATE_BASE64
            IOS_CERTIFICATE_PASSWORD
            IOS_PROVISIONING_PROFILE_BASE64
            APPLE_TEAM_ID
          )
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required secret or variable: $key" >&2
              exit 1
            fi
          done

      - name: Render Shorebird config
        run: python scripts/write_shorebird_yaml.py --app-id "$SHOREBIRD_APP_ID" --output shorebird.yaml --auto-update false

      - name: Validate Firebase config for iOS push
        run: |
          set -euo pipefail
          enabled="$(printf '%s' "${PUSH_NOTIFICATIONS_ENABLED:-false}" | tr '[:upper:]' '[:lower:]')"
          if [ "$enabled" != "true" ]; then
            echo "Push notifications disabled for this release."
            exit 0
          fi

          required=(
            FIREBASE_API_KEY
            FIREBASE_IOS_APP_ID
            FIREBASE_MESSAGING_SENDER_ID
            FIREBASE_PROJECT_ID
            FIREBASE_IOS_BUNDLE_ID
            GOOGLE_SERVICE_INFO_PLIST_BASE64
          )
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing Firebase configuration: $key" >&2
              exit 1
            fi
          done

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Analyze
        run: flutter analyze --no-fatal-infos

      - name: Configure Firebase iOS services
        if: env.GOOGLE_SERVICE_INFO_PLIST_BASE64 != ''
        run: |
          set -euo pipefail
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Ensure CocoaPods is available
        run: pod --version

      - name: Install iOS pods
        run: |
          set -euo pipefail
          cd ios
          pod install --repo-update

      - name: Prepare Flutter dart-defines
        id: dart_defines
        run: |
          set -euo pipefail
          sanitize() {
            printf '%s' "$1" | tr -d '\r\n'
          }

          {
            echo "args<<EOF"
            echo "--dart-define=BACKEND_BASE_URL=$(sanitize "$BACKEND_BASE_URL")"
            echo "--dart-define=COINGECKO_API_BASE_URL=$(sanitize "$COINGECKO_API_BASE_URL")"
            echo "--dart-define=CONNECTIVITY_CHECK_URL=$(sanitize "$CONNECTIVITY_CHECK_URL")"
            echo "--dart-define=PUSH_NOTIFICATIONS_ENABLED=$(sanitize "$PUSH_NOTIFICATIONS_ENABLED")"
            echo "--dart-define=FIREBASE_API_KEY=$(sanitize "$FIREBASE_API_KEY")"
            echo "--dart-define=FIREBASE_ANDROID_APP_ID=$(sanitize "$FIREBASE_ANDROID_APP_ID")"
            echo "--dart-define=FIREBASE_IOS_APP_ID=$(sanitize "$FIREBASE_IOS_APP_ID")"
            echo "--dart-define=FIREBASE_MESSAGING_SENDER_ID=$(sanitize "$FIREBASE_MESSAGING_SENDER_ID")"
            echo "--dart-define=FIREBASE_PROJECT_ID=$(sanitize "$FIREBASE_PROJECT_ID")"
            echo "--dart-define=FIREBASE_STORAGE_BUCKET=$(sanitize "$FIREBASE_STORAGE_BUCKET")"
            echo "--dart-define=FIREBASE_IOS_BUNDLE_ID=$(sanitize "$FIREBASE_IOS_BUNDLE_ID")"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Configure iOS code signing assets
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/ios_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/owllet.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/owllet-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/owllet.mobileprovision"

      - name: Create ExportOptions.plist
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>compileBitcode</key>
            <false/>
            <key>method</key>
            <string>${IOS_EXPORT_METHOD}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF

      - name: Create Shorebird patch-signing public key
        run: |
          set -euo pipefail
          python scripts/write_shorebird_key.py \
            --env SHOREBIRD_PATCH_PUBLIC_KEY_BASE64 \
            --kind public \
            --output "$RUNNER_TEMP/shorebird_public.pem"

      - name: Create Shorebird iOS release
        run: |
          set -euo pipefail
          readarray -t DART_DEFINES <<< "${{ steps.dart_defines.outputs.args }}"
          read -r -a SHOREBIRD_BUILD_ARGS <<< "${SHOREBIRD_FLUTTER_BUILD_ARGS:-}"
          set +o pipefail
          printf 'y\n' | shorebird release ios \
            --flutter-version="$FLUTTER_VERSION" \
            --public-key-path="$RUNNER_TEMP/shorebird_public.pem" \
            -- \
            "${SHOREBIRD_BUILD_ARGS[@]}" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" \
            "${DART_DEFINES[@]}"
          status=$?
          set -o pipefail
          exit $status

      - name: Generate release manifest
        id: manifest
        run: |
          set -euo pipefail
          python scripts/shorebird_release_manifest.py \
            --repo-root . \
            --platform ios \
            --flutter-version "$FLUTTER_VERSION" \
            --no-tree-shake-icons \
            --output "$RUNNER_TEMP/shorebird-release-manifest.json"
          release_version="$(python - <<'PY'
          import pathlib
          import re

          pubspec = pathlib.Path('pubspec.yaml').read_text(encoding='utf-8').splitlines()
          for line in pubspec:
              match = re.match(r'^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)\s*$', line.strip())
              if match:
                  print(f"{match.group(1)}+{match.group(2)}")
                  break
          PY
          )"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Upload iOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shorebird-ios-release-${{ steps.manifest.outputs.release_version }}
          path: |
            build/ios/ipa/*.ipa
            build/ios/archive/*.xcarchive
          if-no-files-found: error

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: shorebird-release-manifest-ios-${{ steps.manifest.outputs.release_version }}
          path: ${{ runner.temp }}/shorebird-release-manifest.json
          if-no-files-found: error
          retention-days: 90

  validate_release_lineage:
    runs-on: ubuntu-latest
    needs: release_ios
    defaults:
      run:
        shell: bash
    env:
      FLUTTER_VERSION: 3.38.6
      SHOREBIRD_APP_ID: ${{ vars.SHOREBIRD_APP_ID || secrets.SHOREBIRD_APP_ID || '' }}
      SHOREBIRD_FLUTTER_BUILD_ARGS: --no-tree-shake-icons
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Render Shorebird config
        run: python scripts/write_shorebird_yaml.py --app-id "$SHOREBIRD_APP_ID" --output shorebird.yaml --auto-update false

      - name: Download release manifest
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/shorebird-manifest
          pattern: shorebird-release-manifest-ios-*
          merge-multiple: true

      - name: Verify release-line OTA safety
        run: |
          set -euo pipefail
          if [ "${SHOREBIRD_FLUTTER_BUILD_ARGS:-}" = *"--no-tree-shake-icons"* ]; then
            patch_guard_args=(--no-tree-shake-icons)
          else
            patch_guard_args=()
          fi
          python scripts/shorebird_patch_guard.py \
            --repo-root . \
            --manifest "$RUNNER_TEMP/shorebird-manifest/shorebird-release-manifest.json" \
            --flutter-version "$FLUTTER_VERSION" \
            "${patch_guard_args[@]}" \
            --allow-empty-diff
