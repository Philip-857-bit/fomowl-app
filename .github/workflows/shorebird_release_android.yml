name: Shorebird Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release_android:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      FLUTTER_VERSION: 3.44.6
      SHOREBIRD_FLUTTER_BUILD_ARGS: --no-tree-shake-icons
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      SHOREBIRD_APP_ID: ${{ vars.SHOREBIRD_APP_ID || secrets.SHOREBIRD_APP_ID || '' }}
      SHOREBIRD_PATCH_PUBLIC_KEY_BASE64: ${{ secrets.SHOREBIRD_PATCH_PUBLIC_KEY_BASE64 }}
      GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
      BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL || 'https://core.owlletapp.com' }}
      BACKEND_CERT_SHA256_PINS: ${{ vars.BACKEND_CERT_SHA256_PINS || secrets.BACKEND_CERT_SHA256_PINS || '' }}
      COINGECKO_API_BASE_URL: ${{ vars.COINGECKO_API_BASE_URL || secrets.COINGECKO_API_BASE_URL || 'https://api.coingecko.com/api/v3' }}
      CONNECTIVITY_CHECK_URL: ${{ vars.CONNECTIVITY_CHECK_URL || secrets.CONNECTIVITY_CHECK_URL || 'https://www.google.com' }}
      PUSH_NOTIFICATIONS_ENABLED: ${{ vars.PUSH_NOTIFICATIONS_ENABLED || 'false' }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY || secrets.FIREBASE_API_KEY || '' }}
      FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID || secrets.FIREBASE_ANDROID_APP_ID || '' }}
      FIREBASE_IOS_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID || secrets.FIREBASE_IOS_APP_ID || '' }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID || secrets.FIREBASE_MESSAGING_SENDER_ID || '' }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID || '' }}
      FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET || secrets.FIREBASE_STORAGE_BUCKET || '' }}
      FIREBASE_IOS_BUNDLE_ID: ${{ vars.FIREBASE_IOS_BUNDLE_ID || secrets.FIREBASE_IOS_BUNDLE_ID || '' }}
      CASH_IN_MINI_APP_URL: ${{ vars.CASH_IN_MINI_APP_URL || secrets.CASH_IN_MINI_APP_URL || '' }}
      CASH_IN_MINI_APP_ALLOWED_ORIGINS: ${{ vars.CASH_IN_MINI_APP_ALLOWED_ORIGINS || secrets.CASH_IN_MINI_APP_ALLOWED_ORIGINS || '' }}
      AFFILIATE_MINI_APP_URL: ${{ vars.AFFILIATE_MINI_APP_URL || secrets.AFFILIATE_MINI_APP_URL || '' }}
      AFFILIATE_MINI_APP_ALLOWED_ORIGINS: ${{ vars.AFFILIATE_MINI_APP_ALLOWED_ORIGINS || secrets.AFFILIATE_MINI_APP_ALLOWED_ORIGINS || '' }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h /
          # Remove large pre-installed toolchains that this build does not use. The Flutter +
          # Rust + Android release build (4 native targets, ProGuard/R8, AAB) needs every spare
          # gigabyte; the runner's default ~14 GB of free space is otherwise exhausted, producing
          # "No space left on device" during Gradle packaging.
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Set up Android 17 SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 platform
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Report Shorebird toolchain
        run: shorebird --version

      - name: Validate Shorebird release inputs
        run: |
          set -euo pipefail
          required=(
            SHOREBIRD_TOKEN
            SHOREBIRD_APP_ID
            SHOREBIRD_PATCH_PUBLIC_KEY_BASE64
            KEYSTORE_BASE64
            KEYSTORE_PASSWORD
            KEY_ALIAS
            KEY_PASSWORD
          )
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required secret or variable: $key" >&2
              exit 1
            fi
          done

      - name: Render Shorebird config
        run: python scripts/write_shorebird_yaml.py --app-id "$SHOREBIRD_APP_ID" --output shorebird.yaml --auto-update false

      - name: Validate Firebase config for Android push
        run: |
          set -euo pipefail
          enabled="$(printf '%s' "${PUSH_NOTIFICATIONS_ENABLED:-false}" | tr '[:upper:]' '[:lower:]')"
          if [ "$enabled" != "true" ]; then
            echo "Push notifications disabled for this release."
            exit 0
          fi

          required=(
            FIREBASE_API_KEY
            FIREBASE_ANDROID_APP_ID
            FIREBASE_MESSAGING_SENDER_ID
            FIREBASE_PROJECT_ID
            GOOGLE_SERVICES_JSON_BASE64
          )
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing Firebase configuration: $key" >&2
              exit 1
            fi
          done

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Analyze
        run: flutter analyze --no-fatal-infos

      - name: Configure Android signing
        run: |
          set -euo pipefail
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/owllet-release.jks
          cat > android/key.properties <<EOF
          storeFile=../keystore/owllet-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Configure Firebase Android services
        if: env.GOOGLE_SERVICES_JSON_BASE64 != ''
        run: |
          set -euo pipefail
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Prepare Flutter dart-defines
        id: dart_defines
        run: |
          set -euo pipefail
          sanitize() {
            printf '%s' "$1" | tr -d '\r\n'
          }

          {
            echo "args<<EOF"
            echo "--dart-define=BACKEND_BASE_URL=$(sanitize "$BACKEND_BASE_URL")"
            echo "--dart-define=BACKEND_CERT_SHA256_PINS=$(sanitize "$BACKEND_CERT_SHA256_PINS")"
            echo "--dart-define=COINGECKO_API_BASE_URL=$(sanitize "$COINGECKO_API_BASE_URL")"
            echo "--dart-define=CONNECTIVITY_CHECK_URL=$(sanitize "$CONNECTIVITY_CHECK_URL")"
            echo "--dart-define=PUSH_NOTIFICATIONS_ENABLED=$(sanitize "$PUSH_NOTIFICATIONS_ENABLED")"
            echo "--dart-define=FIREBASE_API_KEY=$(sanitize "$FIREBASE_API_KEY")"
            echo "--dart-define=FIREBASE_ANDROID_APP_ID=$(sanitize "$FIREBASE_ANDROID_APP_ID")"
            echo "--dart-define=FIREBASE_IOS_APP_ID=$(sanitize "$FIREBASE_IOS_APP_ID")"
            echo "--dart-define=FIREBASE_MESSAGING_SENDER_ID=$(sanitize "$FIREBASE_MESSAGING_SENDER_ID")"
            echo "--dart-define=FIREBASE_PROJECT_ID=$(sanitize "$FIREBASE_PROJECT_ID")"
            echo "--dart-define=FIREBASE_STORAGE_BUCKET=$(sanitize "$FIREBASE_STORAGE_BUCKET")"
            echo "--dart-define=FIREBASE_IOS_BUNDLE_ID=$(sanitize "$FIREBASE_IOS_BUNDLE_ID")"
            echo "--dart-define=CASH_IN_MINI_APP_URL=$(sanitize "$CASH_IN_MINI_APP_URL")"
            echo "--dart-define=CASH_IN_MINI_APP_ALLOWED_ORIGINS=$(sanitize "$CASH_IN_MINI_APP_ALLOWED_ORIGINS")"
            echo "--dart-define=AFFILIATE_MINI_APP_URL=$(sanitize "$AFFILIATE_MINI_APP_URL")"
            echo "--dart-define=AFFILIATE_MINI_APP_ALLOWED_ORIGINS=$(sanitize "$AFFILIATE_MINI_APP_ALLOWED_ORIGINS")"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Shorebird patch-signing public key
        run: |
          set -euo pipefail
          python scripts/write_shorebird_key.py \
            --env SHOREBIRD_PATCH_PUBLIC_KEY_BASE64 \
            --kind public \
            --output "$RUNNER_TEMP/shorebird_public.pem"

      - name: Create Shorebird Android release
        run: |
          set -euo pipefail
          readarray -t DART_DEFINES <<< "${{ steps.dart_defines.outputs.args }}"
          read -r -a SHOREBIRD_BUILD_ARGS <<< "${SHOREBIRD_FLUTTER_BUILD_ARGS:-}"
          set +o pipefail
          printf 'y\n' | shorebird release android \
            --flutter-version="$FLUTTER_VERSION" \
            --artifact=apk \
            --public-key-path="$RUNNER_TEMP/shorebird_public.pem" \
            -- \
            "${SHOREBIRD_BUILD_ARGS[@]}" \
            "${DART_DEFINES[@]}"
          status=$?
          set -o pipefail
          exit $status

      - name: Verify Android AAB output
        run: |
          set -euo pipefail
          aab_path="build/app/outputs/bundle/release/app-release.aab"
          if [ ! -f "$aab_path" ]; then
            echo "Expected Shorebird AAB not found at $aab_path" >&2
            exit 1
          fi
          ls -lh "$aab_path"

      - name: Generate release manifest
        id: manifest
        run: |
          set -euo pipefail
          python scripts/shorebird_release_manifest.py \
            --repo-root . \
            --platform android \
            --flutter-version "$FLUTTER_VERSION" \
            --no-tree-shake-icons \
            --output "$RUNNER_TEMP/shorebird-release-manifest.json"
          release_version="$(python - <<'PY'
          import pathlib
          import re

          pubspec = pathlib.Path('pubspec.yaml').read_text(encoding='utf-8').splitlines()
          for line in pubspec:
              match = re.match(r'^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)\s*$', line.strip())
              if match:
                  print(f"{match.group(1)}+{match.group(2)}")
                  break
          PY
          )"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Upload Android artifacts to Dropbox
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
        run: |
          set -euo pipefail

          if [ -n "${DROPBOX_REFRESH_TOKEN:-}" ] && [ -n "${DROPBOX_APP_KEY:-}" ] && [ -n "${DROPBOX_APP_SECRET:-}" ]; then
            echo "Fetching new access token using refresh token..."
            RESPONSE=$(curl -s -X POST https://api.dropboxapi.com/oauth2/token \
              -d grant_type=refresh_token \
              -d refresh_token="$DROPBOX_REFRESH_TOKEN" \
              -u "$DROPBOX_APP_KEY:$DROPBOX_APP_SECRET")

            NEW_TOKEN=$(echo "$RESPONSE" | grep -o '"access_token": *"[^"]*"' | grep -o '"[^"]*"$' | tr -d '"' || true)
            if [ -n "$NEW_TOKEN" ]; then
              DROPBOX_ACCESS_TOKEN="$NEW_TOKEN"
            else
              echo "Failed to retrieve access token from Dropbox response:" >&2
              echo "$RESPONSE" >&2
              exit 1
            fi
          fi

          if [ -z "${DROPBOX_ACCESS_TOKEN:-}" ]; then
            echo "No DROPBOX_ACCESS_TOKEN available. Skipping Dropbox upload."
            exit 0
          fi

          apk_path=""
          for candidate in \
            "build/app/outputs/flutter-apk/app-release.apk" \
            "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          do
            if [ -f "$candidate" ]; then
              apk_path="$candidate"
              break
            fi
          done

          if [ ! -f "$apk_path" ]; then
            echo "Expected Shorebird APK not found under build/app/outputs/flutter-apk" >&2
            exit 1
          fi

          aab_path="build/app/outputs/bundle/release/app-release.aab"
          if [ ! -f "$aab_path" ]; then
            echo "Expected Shorebird AAB not found under build/app/outputs/bundle/release" >&2
            exit 1
          fi

          # Upload APK
          curl -s -X POST https://content.dropboxapi.com/2/files/upload \
            --header "Authorization: Bearer $DROPBOX_ACCESS_TOKEN" \
            --header "Dropbox-API-Arg: {\"path\": \"/owllet1.apk\",\"mode\": \"overwrite\",\"autorename\": false,\"mute\": false,\"strict_conflict\": false}" \
            --header "Content-Type: application/octet-stream" \
            --data-binary "@$apk_path"
          echo
          echo "Dropbox upload completed for owllet1.apk"

          # Upload AAB
          curl -s -X POST https://content.dropboxapi.com/2/files/upload \
            --header "Authorization: Bearer $DROPBOX_ACCESS_TOKEN" \
            --header "Dropbox-API-Arg: {\"path\": \"/owllet1.aab\",\"mode\": \"overwrite\",\"autorename\": false,\"mute\": false,\"strict_conflict\": false}" \
            --header "Content-Type: application/octet-stream" \
            --data-binary "@$aab_path"
          echo
          echo "Dropbox upload completed for owllet1.aab"

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shorebird-android-release-${{ steps.manifest.outputs.release_version }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: shorebird-release-manifest-android-${{ steps.manifest.outputs.release_version }}
          path: ${{ runner.temp }}/shorebird-release-manifest.json
          if-no-files-found: error
          retention-days: 90

  validate_release_lineage:
    runs-on: ubuntu-latest
    needs: release_android
    defaults:
      run:
        shell: bash
    env:
      FLUTTER_VERSION: 3.44.6
      SHOREBIRD_APP_ID: ${{ vars.SHOREBIRD_APP_ID || secrets.SHOREBIRD_APP_ID || '' }}
      SHOREBIRD_FLUTTER_BUILD_ARGS: --no-tree-shake-icons
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Render Shorebird config
        run: python scripts/write_shorebird_yaml.py --app-id "$SHOREBIRD_APP_ID" --output shorebird.yaml --auto-update false

      - name: Download release manifest
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/shorebird-manifest
          pattern: shorebird-release-manifest-android-*
          merge-multiple: true

      - name: Verify release-line OTA safety
        run: |
          set -euo pipefail
          if [[ "${SHOREBIRD_FLUTTER_BUILD_ARGS:-}" == *"--no-tree-shake-icons"* ]]; then
            patch_guard_args=(--no-tree-shake-icons)
          else
            patch_guard_args=()
          fi
          python scripts/shorebird_patch_guard.py \
            --repo-root . \
            --manifest "$RUNNER_TEMP/shorebird-manifest/shorebird-release-manifest.json" \
            --flutter-version "$FLUTTER_VERSION" \
            "${patch_guard_args[@]}" \
            --allow-empty-diff
