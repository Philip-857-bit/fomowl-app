name: Flutter CI/CD Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
      BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL || 'https://fomowl-backend.onrender.com' }}
      COINGECKO_API_BASE_URL: ${{ vars.COINGECKO_API_BASE_URL || secrets.COINGECKO_API_BASE_URL || 'https://api.coingecko.com/api/v3' }}
      CONNECTIVITY_CHECK_URL: ${{ vars.CONNECTIVITY_CHECK_URL || secrets.CONNECTIVITY_CHECK_URL || 'https://www.google.com' }}
      PUSH_NOTIFICATIONS_ENABLED: ${{ vars.PUSH_NOTIFICATIONS_ENABLED || 'false' }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY || secrets.FIREBASE_API_KEY || '' }}
      FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID || secrets.FIREBASE_ANDROID_APP_ID || '' }}
      FIREBASE_IOS_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID || secrets.FIREBASE_IOS_APP_ID || '' }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID || secrets.FIREBASE_MESSAGING_SENDER_ID || '' }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID || '' }}
      FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET || secrets.FIREBASE_STORAGE_BUCKET || '' }}
      FIREBASE_IOS_BUNDLE_ID: ${{ vars.FIREBASE_IOS_BUNDLE_ID || secrets.FIREBASE_IOS_BUNDLE_ID || '' }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
    
    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # Rust toolchain required for flutter_rust_bridge native crypto
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Android NDK targets for cross-compilation
      - name: Add Rust Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      # cargo-ndk for building Rust for Android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Validate Firebase config for push
        shell: bash
        run: |
          set -euo pipefail
          enabled="$(printf '%s' "${PUSH_NOTIFICATIONS_ENABLED:-false}" | tr '[:upper:]' '[:lower:]')"
          if [ "$enabled" != "true" ]; then
            echo "Push notifications disabled for this build; skipping Firebase validation."
            exit 0
          fi

          required=(
            FIREBASE_API_KEY
            FIREBASE_ANDROID_APP_ID
            FIREBASE_MESSAGING_SENDER_ID
            FIREBASE_PROJECT_ID
          )

          missing=0
          for key in "${required[@]}"; do
            value="${!key:-}"
            if [ -z "$value" ]; then
              echo "Missing required Firebase env: $key" >&2
              missing=1
            fi
          done

          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "::warning::Missing GOOGLE_SERVICES_JSON_BASE64 while push is enabled." >&2
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "::warning::Missing required Firebase configuration. Skipping further validation, but continuing build."
            exit 0
          fi

          tmp_json="$(mktemp)"
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$tmp_json"

          if ! grep -q '"project_id"' "$tmp_json"; then
            echo "::warning::google-services.json is malformed: missing project_id" >&2
            exit 0
          fi
          if ! grep -q '"mobilesdk_app_id"' "$tmp_json"; then
            echo "::warning::google-services.json is malformed: missing mobilesdk_app_id" >&2
            exit 0
          fi
          if ! grep -q '"project_number"' "$tmp_json"; then
            echo "::warning::google-services.json is malformed: missing project_number" >&2
            exit 0
          fi

          if ! grep -q "\"project_id\"[[:space:]]*:[[:space:]]*\"${FIREBASE_PROJECT_ID}\"" "$tmp_json"; then
            echo "::warning::FIREBASE_PROJECT_ID does not match google-services.json project_id" >&2
            exit 0
          fi
          if ! grep -q "\"mobilesdk_app_id\"[[:space:]]*:[[:space:]]*\"${FIREBASE_ANDROID_APP_ID}\"" "$tmp_json"; then
            echo "::warning::FIREBASE_ANDROID_APP_ID does not match google-services.json mobilesdk_app_id" >&2
            exit 0
          fi
          if ! grep -q "\"project_number\"[[:space:]]*:[[:space:]]*\"${FIREBASE_MESSAGING_SENDER_ID}\"" "$tmp_json"; then
            echo "::warning::FIREBASE_MESSAGING_SENDER_ID does not match google-services.json project_number" >&2
            exit 0
          fi

          echo "Firebase validation passed."
          
      - name: Install Dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib

      - name: Run Analyze
        run: flutter analyze --no-fatal-infos

      - name: Configure Android release signing
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "KEYSTORE_BASE64 is not configured." >&2
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/owllet-release.jks
          cat > android/key.properties <<EOF
          storeFile=../keystore/owllet-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Configure Firebase Android services
        if: env.GOOGLE_SERVICES_JSON_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Prepare Flutter dart-defines
        id: dart_defines
        shell: bash
        run: |
          set -euo pipefail
          sanitize() {
            printf '%s' "$1" | tr -d '\r\n'
          }

          {
            echo "args<<EOF"
            echo "--dart-define=BACKEND_BASE_URL=$(sanitize "$BACKEND_BASE_URL")"
            echo "--dart-define=COINGECKO_API_BASE_URL=$(sanitize "$COINGECKO_API_BASE_URL")"
            echo "--dart-define=CONNECTIVITY_CHECK_URL=$(sanitize "$CONNECTIVITY_CHECK_URL")"
            echo "--dart-define=PUSH_NOTIFICATIONS_ENABLED=$(sanitize "$PUSH_NOTIFICATIONS_ENABLED")"
            echo "--dart-define=FIREBASE_API_KEY=$(sanitize "$FIREBASE_API_KEY")"
            echo "--dart-define=FIREBASE_ANDROID_APP_ID=$(sanitize "$FIREBASE_ANDROID_APP_ID")"
            echo "--dart-define=FIREBASE_IOS_APP_ID=$(sanitize "$FIREBASE_IOS_APP_ID")"
            echo "--dart-define=FIREBASE_MESSAGING_SENDER_ID=$(sanitize "$FIREBASE_MESSAGING_SENDER_ID")"
            echo "--dart-define=FIREBASE_PROJECT_ID=$(sanitize "$FIREBASE_PROJECT_ID")"
            echo "--dart-define=FIREBASE_STORAGE_BUCKET=$(sanitize "$FIREBASE_STORAGE_BUCKET")"
            echo "--dart-define=FIREBASE_IOS_BUNDLE_ID=$(sanitize "$FIREBASE_IOS_BUNDLE_ID")"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        
      # Only build split APKs (no fat APK) to save storage
      - name: Build APK (Split ABI)
        shell: bash
        run: |
          set -euo pipefail
          readarray -t DART_DEFINES <<< "${{ steps.dart_defines.outputs.args }}"
          flutter build apk --split-per-abi --release "${DART_DEFINES[@]}"
        
      - name: Build App Bundle (AAB)
        shell: bash
        run: |
          set -euo pipefail
          readarray -t DART_DEFINES <<< "${{ steps.dart_defines.outputs.args }}"
          flutter build appbundle --release "${DART_DEFINES[@]}"
        
      - name: Upload Artifacts to Dropbox
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          
          # 1. Fetch short-lived token using refresh token if provided
          if [ -n "${DROPBOX_REFRESH_TOKEN:-}" ] && [ -n "${DROPBOX_APP_KEY:-}" ] && [ -n "${DROPBOX_APP_SECRET:-}" ]; then
            echo "Fetching new access token using refresh token..."
            RESPONSE=$(curl -s -X POST https://api.dropboxapi.com/oauth2/token \
              -d grant_type=refresh_token \
              -d refresh_token="$DROPBOX_REFRESH_TOKEN" \
              -u "$DROPBOX_APP_KEY:$DROPBOX_APP_SECRET")
            
            # Basic parsing to extract the token
            NEW_TOKEN=$(echo "$RESPONSE" | grep -o '"access_token": *"[^"]*"' | grep -o '"[^"]*"$' | tr -d '"' || true)
            if [ -n "$NEW_TOKEN" ]; then
              DROPBOX_ACCESS_TOKEN="$NEW_TOKEN"
            else
              echo "Failed to retrieve access token from response:" >&2
              echo "$RESPONSE" >&2
              exit 1
            fi
          fi
          
          # 2. Upload if we have an active access token
          if [ -z "${DROPBOX_ACCESS_TOKEN:-}" ]; then
            echo "No DROPBOX_ACCESS_TOKEN available. Skipping Dropbox upload."
            exit 0
          fi
          
          upload_to_dropbox() {
            local file_path=$1
            local dest_name=$2
            echo "Uploading $file_path to Dropbox as /$dest_name..."
            curl -s -X POST https://content.dropboxapi.com/2/files/upload \
              --header "Authorization: Bearer $DROPBOX_ACCESS_TOKEN" \
              --header "Dropbox-API-Arg: {\"path\": \"/$dest_name\",\"mode\": \"overwrite\",\"autorename\": false,\"mute\": false,\"strict_conflict\": false}" \
              --header "Content-Type: application/octet-stream" \
              --data-binary "@$file_path"
            echo -e "\nUpload completed for $dest_name."
          }
          
          if [ -f "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
            upload_to_dropbox "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "owllet.apk"
          fi
          
          if [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            upload_to_dropbox "build/app/outputs/bundle/release/app-release.aab" "owllet.aab"
          fi
