name: Flutter CI/CD Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install Dependencies
        run: flutter pub get

      - name: Run Analyze
        run: flutter analyze
        
      - name: Build APK (Fat)
        run: flutter build apk --release
        
      - name: Build APK (Split ABI)
        run: flutter build apk --split-per-abi --release
        
      - name: Build App Bundle (AAB)
        run: flutter build appbundle --release
        
      - name: Upload APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: fomowl-apk-arm64-v8a
          path: fomowl_wallet/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload APK (universal)
        uses: actions/upload-artifact@v4
        with:
          name: fomowl-apk-universal
          path: fomowl_wallet/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: fomowl-apk-armeabi-v7a
          path: fomowl_wallet/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Upload APK (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: fomowl-apk-x86_64
          path: fomowl_wallet/build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: fomowl-aab
          path: fomowl_wallet/build/app/outputs/bundle/release/app-release.aab
