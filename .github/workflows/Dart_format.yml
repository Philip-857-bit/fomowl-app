name: Dart Format

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Read-only: this workflow verifies formatting and fails the check if code is
# not formatted. It no longer auto-commits/pushes on every push, which could
# race concurrent jobs and write to unintended branches.
permissions:
  contents: read

jobs:
  format:
    name: Check Dart formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Use the Flutter-bundled Dart (same SDK as dart.yml / release builds)
      # instead of standalone Dart. This keeps the formatter version and the
      # resolved package language version identical to local development, so the
      # committed formatting is stable across CI and contributors.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      # Resolve dependencies so `dart format` can read analysis_options.yaml
      # (which includes package:flutter_lints/...) and each file's language
      # version instead of falling back to the SDK default.
      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: |
          dart format --output=none --set-exit-if-changed . || {
            dart format lib/screens/swap/swap_screen.dart
            git diff -- lib/screens/swap/swap_screen.dart
            exit 1
          }
