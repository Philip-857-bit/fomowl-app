name: Dart Format

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only: this workflow verifies formatting and fails the check if code is
# not formatted. It no longer auto-commits/pushes on every push, which could
# race concurrent jobs and write to unintended branches.
permissions:
  contents: read

jobs:
  format:
    name: Check Dart formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
