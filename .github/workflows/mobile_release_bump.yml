name: Mobile Version Bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "SemVer bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump-mobile-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump mobile version
        shell: pwsh
        run: ./scripts/bump_mobile_version.ps1 -Bump "${{ inputs.bump }}"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git commit -m "chore(mobile): bump version (${{ inputs.bump }})"; then
            git push
          else
            echo "No changes to commit"
          fi
