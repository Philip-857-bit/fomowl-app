name: Discover CI

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  flutter-discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure private Owllet Core access
        uses: ./.github/actions/setup-owllet-core
        with:
          ssh-private-key: ${{ secrets.OWLLET_CORE_SSH_KEY }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Discover files
        run: >
          flutter analyze
          lib/features/discover
          test/browser_session_controller_test.dart
          test/discover_url_utils_test.dart
          test/discover_catalog_service_test.dart
          test/discover_blocked_view_test.dart
          test/discover_landing_view_test.dart
          test/admin_dashboard_screen_test.dart
          test/dapp_provider_bridge_test.dart
          test/discover_network_access_test.dart
          test/deep_link_service_test.dart
          test/app_chain_theme_test.dart
          integration_test/discover_browser_flow_test.dart
          integration_test/discover_smoke_test.dart

      - name: Run focused Discover Flutter tests
        run: >
          flutter test
          test/discover_url_utils_test.dart
          test/discover_catalog_service_test.dart
          test/browser_session_controller_test.dart
          test/discover_blocked_view_test.dart
          test/discover_landing_view_test.dart
          test/admin_dashboard_screen_test.dart
          test/dapp_provider_bridge_test.dart
          test/discover_network_access_test.dart
          test/deep_link_service_test.dart
          test/app_chain_theme_test.dart

  android-discover-integration:
    # The emulator suite is intentionally opt-in. The focused Discover tests
    # above remain the required, fast signal on every pull request and push.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Configure private Owllet Core access
        uses: ./.github/actions/setup-owllet-core
        with:
          ssh-private-key: ${{ secrets.OWLLET_CORE_SSH_KEY }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h

      # Compile the Rust bridge and Android application before QEMU starts.
      # Keeping the emulator alive during the cold native build starves QEMU on
      # hosted runners and caused repeated hanging-thread/runner-eviction errors.
      - name: Set up Android SDK and native tooling
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;28.2.13676358

      - name: Prebuild Android debug application
        run: flutter build apk --debug --target-platform android-x64

      - name: Check KVM access
        id: kvm
        shell: bash
        run: |
          if test -r /dev/kvm -a -w /dev/kvm; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo KVM_AVAILABLE
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo KVM_UNAVAILABLE
          fi

      - name: Run Discover integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 1200
          disable-animations: true
          disable-linux-hw-accel: ${{ steps.kvm.outputs.available != 'true' }}
          cores: 2
          ram-size: 2048M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: flutter test integration_test/discover_browser_flow_test.dart integration_test/discover_smoke_test.dart -d emulator-5554
