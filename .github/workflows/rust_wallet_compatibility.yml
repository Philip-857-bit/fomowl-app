name: Owllet Rust Wallet Compatibility

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'rust/**'
      - '.cargo/**'
      - '.github/actions/setup-owllet-core/**'
      - '.github/workflows/rust_wallet_compatibility.yml'
  push:
    branches: [main, develop]
    paths:
      - 'rust/**'
      - '.cargo/**'
      - '.github/actions/setup-owllet-core/**'
      - '.github/workflows/rust_wallet_compatibility.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: rust

jobs:
  wallet-compatibility:
    name: Validate Wallet Invariants & Compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure private Owllet Core access
        uses: ./.github/actions/setup-owllet-core
        with:
          ssh-private-key: ${{ secrets.OWLLET_CORE_SSH_KEY }}

      - name: Setup stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Check formatting (rust_lib_fomowl_wallet)
        run: cargo fmt --all -- --check

      - name: Lint with Clippy (rust_lib_fomowl_wallet)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run full Rust test suite (rust_lib_fomowl_wallet)
        run: cargo test --locked --all-targets --all-features

      - name: Verify private SDK consumer
        run: cargo run --locked --manifest-path consumers/owllet-core-smoke/Cargo.toml -- --self-test
