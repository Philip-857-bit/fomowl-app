org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.vfs.watch=false
android.useAndroidX=true
# Allow command-line/CI Gradle builds to obtain the compileSdk platform when
# it is newer than the runner image. SDK licenses are accepted in CI first.
android.builder.sdkDownload=true
android.enableR8.fullMode=true
# Flutter 3.44 compatibility mode for plugins that still apply the Kotlin
# Gradle Plugin or use the legacy Android Gradle Plugin DSL.
android.builtInKotlin=false
android.newDsl=false
